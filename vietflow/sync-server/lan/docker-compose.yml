# Donut sync server on a machine in the office network, without a domain or
# HTTPS: only for a network where every device is trusted. Devices reach it
# at http://<this machine's LAN IP>:12342. With SYNC_AT_REST_KEY set, every
# transfer goes through donut-sync, so storage has no port of its own.
services:
  s3:
    image: rclone/rclone:latest
    restart: unless-stopped
    command:
      - serve
      - s3
      - /data
      - --addr
      - :9000
      - --auth-key
      - ${S3_ACCESS_KEY_ID},${S3_SECRET_ACCESS_KEY}
      - --force-path-style
      - --vfs-cache-mode
      - writes
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "9000"]
      interval: 5s
      timeout: 5s
      retries: 20

  donut-sync:
    build: ../../../donut-sync
    restart: unless-stopped
    depends_on:
      s3:
        condition: service_healthy
    environment:
      SYNC_TOKEN: ${SYNC_TOKEN}
      PORT: "12342"
      S3_ENDPOINT: http://s3:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_BUCKET: donut-sync
      S3_FORCE_PATH_STYLE: "true"
      SYNC_AT_REST_KEY: ${SYNC_AT_REST_KEY:?SYNC_AT_REST_KEY is required}
    ports:
      - "12342:12342"
