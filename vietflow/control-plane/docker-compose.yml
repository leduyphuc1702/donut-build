# Control plane tài khoản Donut, chạy sau Caddy (HTTPS).
#
# - Chỉ Caddy mở 80/443. Control plane chỉ nghe trong mạng compose.
# - CONTROL_TOKEN là mật khẩu duy nhất để lấy mã đăng nhập; đổi ngay sau khi
#   triển khai và không commit .env.
services:
  control-plane:
    build: .
    restart: unless-stopped
    environment:
      PORT: "8787"
      CONTROL_TOKEN: ${CONTROL_TOKEN:?CONTROL_TOKEN is required}
      AUTO_LOGIN_KEY: ${AUTO_LOGIN_KEY:-}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      ACCOUNT_ID: ${ACCOUNT_ID:-selfhosted-owner}
      ACCOUNT_EMAIL: ${ACCOUNT_EMAIL:-owner@selfhosted.local}
      ACCOUNT_PLAN: ${ACCOUNT_PLAN:-enterprise}
      SYNC_SERVER_URL: ${SYNC_SERVER_URL:-}
      SYNC_SHARED_TOKEN: ${SYNC_SHARED_TOKEN:-}
      TEAM_ID: ${TEAM_ID:-local-team}
      TEAM_NAME: ${TEAM_NAME:-Vietflow}
      DATA_DIR: /data
    # The activity log, the agent routines and the member list are the only
    # state this service keeps.
    volumes:
      - control_data:/data
    # Uncomment to reach it directly from the LAN instead of through Caddy:
    # ports:
    #   - "8787:8787"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - control-plane
    ports:
      - "80:80"
      - "443:443"
    environment:
      CONTROL_DOMAIN: ${CONTROL_DOMAIN:?CONTROL_DOMAIN is required}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  control_data:
  caddy_data:
  caddy_config:
